---
features:
  - |
    ``QCDLModule.one_to_all`` now accepts any group of qubits as its
    ``destinations``: a ``Scope``, a single ``QCDLModule``, or a sequence of
    either. Qubits are deduplicated by name, preserving the order in which they
    are given.
fixes:
  - |
    Fix ``QCDLModule.one_to_all`` raising an ``AttributeError`` when
    ``destinations`` is a sequence of qubits, such as the ``qcdl_modules`` of a
    ``Scope``, rather than the ``Scope`` itself.
upgrade:
  - |
    ``QCDLModule.one_to_all`` tags its statements with a ``scope_id`` only when
    ``destinations`` is a ``Scope``; a bare sequence of qubits has no identity
    of its own and so carries no ``scope_id``.
  - |
    ``QCDLModule.one_to_all`` now raises ``QCDLUserError`` if ``destinations``
    is not a group of qubits, contains something that is not a qubit, or holds
    no qubits at all. Its docstring previously advertised ``ValueError``, which
    it did not raise.
